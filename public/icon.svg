<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Glowing circle behind icon -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#shadow)"/>

  <!-- Logo Graphics: iaPedido Chat Bubble + Delivery Bag / Bot Sparkle -->
  <!-- Outer Chat/Bag Container -->
  <rect x="146" y="156" width="220" height="190" rx="36" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#shadow)"/>

  <!-- Top Handle -->
  <path d="M 206 156 A 50 50 0 0 1 306 156" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Inner Smart AI Lightning & Bell Icon -->
  <path d="M 266 196 L 226 266 L 260 266 L 246 316 L 296 246 L 262 246 Z" fill="url(#emeraldGrad)"/>

  <!-- Notification Badge (Small Glowing Circle) -->
  <circle cx="346" cy="176" r="22" fill="#ef4444" stroke="#0f172a" stroke-width="6"/>
  <circle cx="346" cy="176" r="12" fill="#ffffff"/>

  <!-- Text "iaPedido" at the bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">
    ia<tspan fill="#34d399">Pedido</tspan>
  </text>
</svg>
